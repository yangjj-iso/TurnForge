name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Accept packaged application
        run: python3 scripts/smoke.py --output-dir target/acceptance
      - name: Upload JAR and verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: turnforge-java-${{ matrix.java }}
          path: |
            target/turnforge.jar
            target/surefire-reports/
            target/acceptance/result.json
            target/acceptance/server.log
          retention-days: 14
